<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>

    <!-- Glowing Accent Gradient (Blue to Purple) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="80%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Text Gradient for Name -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0e7ff" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="radialBlue" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#070a12" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="radialPurple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#070a12" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
      <circle cx="30" cy="0" r="1" fill="#475569" fill-opacity="0.5" />
    </pattern>

    <style>
      .glow-pulse {
        animation: pulseGlow 4s ease-in-out infinite alternate;
      }
      .line-flow {
        stroke-dasharray: 8 6;
        animation: flowDash 25s linear infinite;
      }
      .tag-shimmer {
        animation: shimmerText 5s ease-in-out infinite;
      }
      .status-pulse {
        animation: greenPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.65; transform: scale(1.02); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -400; }
      }
      @keyframes greenPulse {
        0%, 100% { opacity: 1; r: 4.5; }
        50% { opacity: 0.4; r: 6.5; }
      }
      .mono-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .sans-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="270" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="160" cy="80" r="220" fill="url(#radialBlue)" />
  <circle cx="740" cy="200" r="240" fill="url(#radialPurple)" />

  <!-- Tech Grid Background -->
  <rect width="900" height="270" rx="16" fill="url(#grid)" />

  <!-- Glowing Border -->
  <rect x="1.5" y="1.5" width="897" height="267" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Animated Circuit Line -->
  <path d="M 40 250 L 260 250 L 290 220 L 780 220" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.35" class="line-flow" />

  <!-- Top Status Bar -->
  <g transform="translate(48, 42)">
    <!-- Terminal Identifier Chip -->
    <rect x="0" y="0" width="136" height="26" rx="13" fill="#1e1b4b" fill-opacity="0.75" stroke="#6366f1" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="16" cy="13" r="4.5" fill="#10b981" class="status-pulse" />
    <text x="28" y="17" fill="#c7d2fe" font-size="11" font-weight="600" class="mono-text">JV2008 // DEV</text>

    <!-- Mode Badge -->
    <rect x="146" y="0" width="206" height="26" rx="13" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="158" y="17" fill="#94a3b8" font-size="11" font-weight="500" class="mono-text">FULL-STACK &amp; DATA/AI</text>

    <!-- Location / Base Indicator -->
    <text x="755" y="17" fill="#64748b" font-size="11" text-anchor="end" font-weight="500" class="mono-text">STATUS: ACTIVE &amp; OPEN TO TECH ROLES</text>
  </g>

  <!-- Main Name & Title -->
  <g transform="translate(48, 118)">
    <text x="0" y="0" fill="url(#textGrad)" font-size="44" font-weight="800" letter-spacing="-0.8" class="sans-text">
      JOÃO VICTOR
    </text>
    
    <!-- Accent Line under Name -->
    <rect x="0" y="12" width="280" height="3.5" rx="1.75" fill="url(#accentGrad)" />
  </g>

  <!-- Tagline / Mission -->
  <g transform="translate(48, 164)">
    <text x="0" y="0" fill="#f1f5f9" font-size="16" font-weight="600" class="sans-text">
      Software Engineer · Full-Stack &amp; Modern Architecture
    </text>
    <text x="0" y="24" fill="#94a3b8" font-size="13.5" font-weight="400" class="sans-text">
      Building scalable web applications, robust APIs &amp; analytical systems — from relational core to applied AI.
    </text>
  </g>

  <!-- Bottom Core Stack Pills -->
  <g transform="translate(48, 224)">
    <!-- Pill 1: Next.js / TypeScript -->
    <rect x="0" y="0" width="144" height="26" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6" />
    <text x="72" y="17" fill="#e0f2fe" font-size="11.5" font-weight="600" text-anchor="middle" class="mono-text">Next.js · TypeScript</text>

    <!-- Pill 2: C# .NET / Java -->
    <rect x="154" y="0" width="134" height="26" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.6" />
    <text x="221" y="17" fill="#e0e7ff" font-size="11.5" font-weight="600" text-anchor="middle" class="mono-text">C# .NET · Java</text>

    <!-- Pill 3: PostgreSQL / Neon -->
    <rect x="298" y="0" width="156" height="26" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.6" />
    <text x="376" y="17" fill="#f3e8ff" font-size="11.5" font-weight="600" text-anchor="middle" class="mono-text">PostgreSQL · Neon DB</text>

    <!-- Pill 4: Cloud & Data -->
    <rect x="464" y="0" width="154" height="26" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.6" />
    <text x="541" y="17" fill="#cffafe" font-size="11.5" font-weight="600" text-anchor="middle" class="mono-text">GCP · BigQuery · Data</text>

    <!-- Pill 5: Applied AI -->
    <rect x="628" y="0" width="128" height="26" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#ec4899" stroke-width="0.8" stroke-opacity="0.6" />
    <text x="692" y="17" fill="#fce7f3" font-size="11.5" font-weight="600" text-anchor="middle" class="mono-text">Applied AI Agents</text>
  </g>

  <!-- Right Decorative Geometric Element -->
  <g transform="translate(805, 115)" opacity="0.85">
    <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" fill="none" stroke="url(#accentGrad)" stroke-width="1.8" />
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="#6366f1" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
    <circle cx="0" cy="0" r="4" fill="#a855f7" />
  </g>
</svg>
