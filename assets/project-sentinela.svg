<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 150" width="100%" height="100%">
  <defs>
    <linearGradient id="senBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="senAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <pattern id="senGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="450" height="150" rx="12" fill="url(#senBg)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
  <rect width="450" height="150" rx="12" fill="url(#senGrid)" />

  <!-- Top Badge -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="124" height="20" rx="10" fill="#3b0764" fill-opacity="0.4" stroke="#a855f7" stroke-width="0.8" />
    <circle cx="10" cy="10" r="3" fill="#a855f7" />
    <text x="20" y="14" fill="#f3e8ff" font-size="9.5" font-weight="700" class="mono">DATA &amp; SECURITY</text>

    <rect x="134" y="0" width="128" height="20" rx="10" fill="#1e1b4b" fill-opacity="0.5" stroke="#6366f1" stroke-width="0.8" />
    <text x="144" y="14" fill="#c7d2fe" font-size="9.5" font-weight="600" class="mono">ANALYTICS ENGINE</text>
  </g>

  <!-- Title -->
  <g transform="translate(20, 68)">
    <text x="0" y="0" fill="#f8fafc" font-size="19" font-weight="800" class="sans">Sentinela Analytics</text>
    <text x="0" y="20" fill="#94a3b8" font-size="11.5" font-weight="400" class="sans">Dashboard Antifraude &amp; Telemetria Transacional</text>
  </g>

  <!-- Tags -->
  <g transform="translate(20, 118)">
    <rect x="0" y="0" width="94" height="18" rx="4" fill="#1e293b" />
    <text x="47" y="12" fill="#38bdf8" font-size="9.5" font-weight="600" text-anchor="middle" class="mono">JavaScript ES6</text>

    <rect x="102" y="0" width="76" height="18" rx="4" fill="#1e293b" />
    <text x="140" y="12" fill="#a855f7" font-size="9.5" font-weight="600" text-anchor="middle" class="mono">Chart.js</text>

    <rect x="186" y="0" width="98" height="18" rx="4" fill="#1e293b" />
    <text x="235" y="12" fill="#ec4899" font-size="9.5" font-weight="600" text-anchor="middle" class="mono">Pub/Sub State</text>

    <rect x="292" y="0" width="112" height="18" rx="4" fill="#1e293b" />
    <text x="348" y="12" fill="#818cf8" font-size="9.5" font-weight="600" text-anchor="middle" class="mono">BigQuery Ready</text>
  </g>

  <!-- Radar Shield Icon on Right -->
  <g transform="translate(400, 52)" opacity="0.85">
    <path d="M 15 0 L 30 6 L 30 20 C 30 32 15 40 15 40 C 15 40 0 32 0 20 L 0 6 Z" fill="none" stroke="url(#senAccent)" stroke-width="2" />
    <circle cx="15" cy="18" r="4" fill="#a855f7" />
  </g>
</svg>
